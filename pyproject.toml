[project]
name = "inim-prime-primelan"
version = "0.1.5"
description = "Async Python client for INIM Prime alarm panels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPLv3" }
authors = [
    { name = "Pitscheider", email = "pitscheider@tuta.com" }
]
maintainers = [
    { name = "Skacco" }
]
keywords = ["inim", "alarm", "panel", "async", "home-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Skacco/inim-prime-primelan"
"Original project" = "https://github.com/Pitscheider/inim-prime-primelan"

[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"
